[project]
name = "cyent"
version = "0.1.0"
description = "Cyent — a minimal coding agent built from scratch (OpenAI-compatible, no agent frameworks)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["openai>=1.100.0", "python-dotenv>=1.1.0"]

[project.scripts]
cyent = "cyent.main:main"

[dependency-groups]
dev = ["pytest>=8.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cyent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
